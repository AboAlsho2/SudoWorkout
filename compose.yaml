
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sudoworkout-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sudoworkout-network
    restart: unless-stopped
    
    
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  workout-service:
    build:
      context: .
      dockerfile: src/Services/WorkoutService/Dockerfile
    container_name: sudoworkout-workout-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SudoWorkoutDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    networks:
      - sudoworkout-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped


    
  training-service:
    build:
      context: .
      dockerfile: src/Services/TrainingService/Dockerfile
    container_name: sudoworkout-training-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__TrainingDatabase: "Server=sqlserver,1433;Database=SudoWorkoutTrainingDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Services__WorkoutService__BaseUrl: "http://workout-service:8080"
    ports:
      - "8081:8080"
    networks:
      - sudoworkout-network
    depends_on:
      sqlserver:
        condition: service_healthy
      workout-service:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  sudoworkout-network:
    name: sudoworkout-network